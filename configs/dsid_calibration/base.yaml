# @package _global_

defaults:
  - /model: base_model
  - /data: ph14t_*x224x224_qwen_multiling
  - /datamodule: standard
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

teacher:
  # The frozen base LLM is sufficient; no visual backbone is loaded.
  dtype: auto
  device_map: auto

calibration:
  # P75 of JS(q_gloss, q_empty) over every valid training target position.
  quantile: 0.75
  interpolation: linear
  batch_size: 2
  num_workers: 4
  pin_memory: true
  device: null
  # Use a positive value only for a quick diagnostic subset. Keep null for the
  # final value written into model.config.dsid_js_tau.
  max_samples: null
  min_tau: 1.0e-8
  min_gate_coverage: 0.0
  log_every: 100
  fail_on_sanity_check: true
  output_path: outputs/dsid_calibration/dsid_tau.json
