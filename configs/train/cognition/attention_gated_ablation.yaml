# @package _global_

# Shared setup for attention-gated patch-pooling ablations. Individual runs
# should override only the ablation variable(s) and their output directory.
defaults:
  - /train/base
  - override /model: qwen3-4b-cradio-l-attnpool-20m
  - override /data: ph14t_*x224x224_qwen_single_language
  - override /prompt: fixed_prompt
  - _self_

model:
  config:
    visual_adapter_kwargs:
      # Explicit ablation knobs, restating the model-config defaults.
      temporal_scale_factor: 2
      top_k: 48
      attention_smooth_kernel_size: 3
      use_temporal_conv: false
      residual_gate_init: 0.0
      pooling_gate_init: -2.0

engine:
  training_args:
    visual_adapter_learning_rate: 1e-4
    dataloader_num_workers: 8
    eval_steps: 6000
    logging_steps: 15
    ddp_find_unused_parameters: false

data:
  language: de
  processor:
    video_token_scale: 0.5
    num_extra_video_tokens: 2
