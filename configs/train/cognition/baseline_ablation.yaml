# @package _global_

# Shared baseline for cognition ablations. Individual runs should override only
# the ablation variable(s) and their output directory.
defaults:
  - /train/base
  - override /model: qwen3-4b-cradio-l-spatiotemporal-pooled-linear
  - override /data: ph14t_*x224x224_qwen_single_language
  - override /prompt: fixed_prompt
  - _self_

model:
  config:
    visual_adapter_kwargs:
      # Explicit ablation knob; 2 is the model's default temporal pooling.
      temporal_scale_factor: 2

engine:
  # No per-component optimizer override. The adapter is the only large
  # trainable component here, so training_args.learning_rate below is its rate;
  # pinning the same value in engine.optimization would only mean a launcher
  # override of training_args.learning_rate silently missed the adapter.
  training_args:
    dataloader_num_workers: 8
    eval_steps: 6000
    logging_steps: 15
    ddp_find_unused_parameters: false

data:
  language: de
  processor:
    video_token_scale: 0.5
    num_extra_video_tokens: 2
