# @package _global_

defaults:
  - /model: base_model
  - /data: ph14t_*x224x224_qwen_multiling
  - /datamodule: standard
  - /prompt: diverse_train
  - /peft: none
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

model:
  config:
    # Baseline attention is the standard causal (one-way) Qwen attention.
    video_bidirectional_attention: false
    # Baseline uses no adapter-side visual positional embedding. Qwen's RoPE
    # still encodes the order of the emitted visual-token sequence.
    visual_position_embedding_type: none

engine:
  # Which parameters this run optimizes. Applied by
  # `apply_trainability_plan`: everything is frozen first, then exactly the
  # components selected here are re-enabled. All seven components must be
  # listed. LoRA structure itself lives in the `peft` group; a `lora`
  # parameter_mode here only unfreezes the adapters that group injected.
  #
  # `runtime_mode` is a separate, optional field on llm / visual_backbone /
  # visual_adapter, and it is a permission rather than a state: `follow` lets a
  # component enter training mode when the model does, `eval` keeps it
  # deterministic even then, and `model.eval()` always wins over both. Omitting
  # it -- as everything below does -- derives it from parameter_mode: frozen
  # stays in eval, anything trained follows. State it only for the case the
  # derivation cannot express, a trained component that must stay
  # deterministic: `visual_backbone: { parameter_mode: lora, runtime_mode: eval }`
  # trains visual LoRA against a base encoder with its stochastic behavior off.
  #
  # On the backbone that case is only honored by C-RADIO, the one backbone that
  # implements `set_runtime_mode`; the plan's decision reaches a module through
  # a setter looked up by name, and the other backbones do not define it, so
  # there a stated runtime_mode validates and then does nothing.
  trainability:
    llm: { parameter_mode: frozen }
    visual_backbone: { parameter_mode: frozen }
    visual_adapter: { parameter_mode: full }
    ctc_head: { parameter_mode: full }
    # No module is constructed while visual_position_embedding_type=none.
    visual_position_embedding: { parameter_mode: frozen }
    visual_boundary_embeddings: { parameter_mode: full }
    visual_scale: { parameter_mode: full }
  # Sparse per-component optimizer overrides, keyed by the same components as
  # `trainability`. Missing components and fields inherit
  # training_args.learning_rate / weight_decay. Overriding a component this run
  # freezes is an error, not a silent no-op.
  optimization: {}
  evaluate_before_training: false
  train_probe:
    every_n_evaluations: 1
    num_samples: 800
  training_args:
    do_train: true
    do_predict: true
    num_train_epochs: 50
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    report_to: wandb
    remove_unused_columns: False
    ddp_find_unused_parameters: True
    save_strategy: best
    load_best_model_at_end: true
    save_total_limit: 2
    logging_steps: 50
    eval_strategy: "steps"
    eval_steps: 4000
    metric_for_best_model: "eval_overall_weighted_bleu4"
    greater_is_better: True
    learning_rate: 1e-4
    # --- Regularization / optimization stability ---
    # Decoupled weight decay. Transformers excludes biases and LayerNorm
    # parameters automatically, and SltTrainer narrows that further to genuine
    # weight matrices, so this only hits real weight matrices. Per-component
    # overrides live in `engine.optimization.<component>.weight_decay`.
    weight_decay: 0.05
    # In transformers>=5 warmup_steps is a float: a value in [0, 1) is a ratio
    # of total steps, >=1 is an exact step count. 3% of training ramps the LR
    # from 0 before the cosine decay, which stops the freshly initialized
    # adapter from taking large steps against a frozen LLM.
    warmup_steps: 0.03
    # Gradient clipping. This is already the transformers default; it is stated
    # explicitly so a run's clipping threshold is visible in the config.
    max_grad_norm: 1.0
    # WARN: Keep this at 0.0. A non-zero factor makes Trainer.compute_loss pop
    # `labels` out of the model inputs and compute cross entropy from logits
    # itself. SltModel guards its auxiliary terms on `loss is not None`, so the
    # CTC loss would be silently dropped from training with no error. Label smoothing needs a custom compute_loss_func
    # before it can be turned on here.
    label_smoothing_factor: 0.0
    # NEFTune embedding noise. Null disables it. It hooks the LLM's input
    # embedding layer, so it perturbs prompt/text tokens only and leaves the
    # visual soft tokens untouched -- verify that is what you want before
    # setting a value (typical range 5.0-15.0).
    neftune_noise_alpha: null
    dataloader_num_workers: 6
    disable_tqdm: True
    auto_output_dir: False
    output_dir: outputs/test
    lr_scheduler_type: cosine
    dataloader_drop_last: true
  generation_config:
    max_new_tokens: 128
    do_sample: false
    # num_beams: 4
    # early_stopping: true
    # length_penalty: 1.0
  llm_dtype: bfloat16
  visual_backbone_dtype: auto

data:
  processor:
    video_processor:
      padding_to_multiple_of: 4
      do_resize: false
      # C-RADIO performs its expected preprocessing internally.
      do_normalize: false
