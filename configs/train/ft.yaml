# @package _global_

defaults:
  - /model: base_ft
  # - data: ph14t_*x224x224_gemmaslt_multiling
  - /data: ph14t_*x224x224_gemmaslt
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

engine:
  training_args:
    num_train_epochs: 10
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    report_to: wandb
    remove_unused_columns: False
    ddp_find_unused_parameters: False
    save_strategy: steps
    save_steps: 1000
    save_total_limit: 1
    logging_steps: 50
    eval_strategy: "steps"
    eval_steps: 1000
    learning_rate: 1e-5
    dataloader_num_workers: 4
    auto_output_dir: True
    auto_output_root: outputs/ft
    lr_scheduler_type: cosine
  generation_config:
    max_new_tokens: 128
