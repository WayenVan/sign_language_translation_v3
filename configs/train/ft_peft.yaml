# @package _global_

defaults:
  - base
  # Fine-tuning uses varied language-matched prompts for training and the
  # canonical fixed prompt for validation/test; keep this explicit instead of
  # silently inheriting whichever prompt policy base.yaml happens to select.
  - override /prompt: diverse_train
  - override /peft: qwen3-1.7b-llm-last4
  - _self_

model:
  # True resumes an SLT checkpoint; false creates a new SLT model from config.
  load_from_checkpoint: true
  checkpoint_dir: "outputs/v3.0-qwen3-1.7b-cradio-l-dinoframecrossv2shuffle-0815-224x224//checkpoint-54000"

engine:
  # PEFT fine-tuning trains the injected LoRA adapters plus the multimodal
  # visual adapter; every other component stays at the checkpoint's weights.
  trainability:
    # Preserve standard LoRA training behavior, including configured dropout.
    llm: {parameter_mode: lora, runtime_mode: train}
    visual_backbone: {parameter_mode: frozen}
    visual_adapter: {parameter_mode: full, runtime_mode: train}
    ctc_head: {parameter_mode: frozen}
    ctc_codebook: {parameter_mode: full}
    visual_position_embedding: {parameter_mode: frozen}
    visual_boundary_embeddings: {parameter_mode: frozen}
  # Log a step-0 baseline into the same eval_* series as periodic evaluation.
  evaluate_before_training: true
  training_args:
    output_dir: outputs/ft_peft
    num_train_epochs: 25
    learning_rate: 5e-5
    warmup_steps: 0.03
    weight_decay: 0.01
    eval_strategy: steps
    eval_steps: 0.04
