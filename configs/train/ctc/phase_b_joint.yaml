# @package _global_

# Phase B, joint variant: unfreeze the whole visual -> gloss front-end (visual
# adapter + CTC head) and train it together with the codebook against a still
# frozen Qwen3-4B. Versus phase_b_codebook this unfreezes visual_adapter and
# ctc_head; run both and read their dev BLEU against each other.
#
# Hypothesis: a fixed Phase-A gloss front-end caps translation quality. In this
# architecture the CTC head's logits feed BOTH the CTC loss (real supervision,
# pseudo_gloss labels, weight locked at 1.0 by the checkpoint) AND the codebook
# distribution that becomes the LLM prefix. So freezing the single linear layer
# right after a moving adapter is an arbitrary bottleneck: it can only shrink
# the reachable CTC solution and, through the codebook, degrade the prefix. Let
# (adapter, head) co-adapt; the CTC loss keeps them honest.
#
# Rates -- front-end slow, codebook fast, so the codebook (lr 1e-4, from
# phase_b_base) tracks whatever the front-end does rather than chasing it:
#   * adapter body and CTC head at 1e-5 (10x below the codebook).
#   * residual gates stay responsive at 1e-4, decay-free (matches Phase A).
#
# LLM still frozen: this isolates front-end co-adaptation from LLM adaptation.
# LLM LoRA is the next stage, not this one. Overfitting watch: the front-end
# takes gradient against only ~7k sentences -- if the train-probe / dev BLEU gap
# opens early, cut num_train_epochs or drop the front-end rate to 5e-6. Also
# watch eval_ctc_wer: it should hold near Phase A's 0.36 or improve, not drift
# up.

defaults:
  - /train/ctc/phase_b_codebook
  - _self_

engine:
  trainability:
    # The two lines that differ from phase_b_codebook: the visual -> gloss path
    # is trainable, the LLM and backbone stay frozen.
    visual_adapter: { parameter_mode: full }
    ctc_head: { parameter_mode: full }

  optimization:
    # ctc_codebook (lr 1e-4, wd 0) is inherited from phase_b_base.
    visual_adapter:
      learning_rate: 1.0e-5
      weight_decay: 0.01
      parameter_groups:
        gates:
          learning_rate: 1.0e-4
          weight_decay: 0.0
    ctc_head:
      learning_rate: 1.0e-5
      weight_decay: 0.01

  training_args:
    output_dir: outputs/ctc-phase-b-nextframe-handroi-conv-20m-gloss-codebook-jointfrontend-ep30-anneal0.25-0905
    # A pretrained front-end takes gradient from step 0; ramp a little longer
    # than the codebook-only run's 0.03.
    warmup_steps: 0.05
