# @package _global_

defaults:
  - /model: base_model
  - /data: ph14t_*x224x224_qwen_multiling
  - /datamodule: standard
  - /prompt: diverse_train
  - /peft: none
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

model:
  config:
    # Baseline attention is the standard causal (one-way) Qwen attention.
    video_bidirectional_attention: false
    # Baseline uses no adapter-side visual positional embedding. Qwen's RoPE
    # still encodes the order of the emitted visual-token sequence.
    visual_position_embedding_type: none

engine:
  # `ctc_only` bypasses the codebook and LLM for CTC pretraining. `joint`
  # trains/evaluates the complete translation path.
  forward_mode: joint
  # Which parameters this run optimizes. Applied by
  # `apply_trainability_plan`: everything is frozen first, then exactly the
  # components selected here are re-enabled. All seven components must be
  # listed. LoRA structure itself lives in the `peft` group; a `lora`
  # parameter_mode here
  # only unfreezes the adapters that group injected.
  trainability:
    llm: { parameter_mode: frozen, runtime_mode: eval }
    # runtime_mode is currently enforced by C-RADIO only. Keeping it separate
    # from gradient mode allows visual LoRA to train with a deterministic base
    # encoder in eval mode.
    visual_backbone: { parameter_mode: frozen, runtime_mode: eval }
    visual_adapter: { parameter_mode: full, runtime_mode: train }
    ctc_head: { parameter_mode: full }
    ctc_codebook: { parameter_mode: full }
    # No module is constructed while visual_position_embedding_type=none.
    visual_position_embedding: { parameter_mode: frozen }
    visual_boundary_embeddings: { parameter_mode: full }
  # Sparse per-component optimizer overrides. Missing components and fields
  # inherit training_args.learning_rate / weight_decay.
  optimization: {}
  evaluate_before_training: false
  train_probe:
    every_n_evaluations: 1
    num_samples: 800
  training_args:
    do_train: true
    do_predict: true
    num_train_epochs: 50
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    report_to: wandb
    remove_unused_columns: False
    ddp_find_unused_parameters: True
    save_strategy: best
    load_best_model_at_end: true
    save_total_limit: 2
    logging_steps: 50
    eval_strategy: "steps"
    eval_steps: 4000
    metric_for_best_model: "eval_overall_weighted_bleu4"
    greater_is_better: True
    learning_rate: 1e-4
    # --- Regularization / optimization stability ---
    # Decoupled weight decay. Transformers excludes biases and LayerNorm
    # parameters automatically, and SltTrainer's create_optimizer keeps that
    # split when per-component decays are set, so 0.01 only hits real weight
    # matrices. Per-component overrides live in the `*_weight_decay` args.
    weight_decay: 0.05
    # In transformers>=5 warmup_steps is a float: a value in [0, 1) is a ratio
    # of total steps, >=1 is an exact step count. 3% of training ramps the LR
    # from 0 before the cosine decay, which stops the freshly initialized
    # adapter from taking large steps against a frozen LLM.
    warmup_steps: 0.03
    # Gradient clipping. This is already the transformers default; it is stated
    # explicitly so a run's clipping threshold is visible in the config.
    max_grad_norm: 1.0
    # WARN: Keep this at 0.0. A non-zero factor makes Trainer.compute_loss pop
    # `labels` out of the model inputs and compute cross entropy from logits
    # itself. SltModel guards its auxiliary terms on `loss is not None`, so the
    # CTC loss would be silently dropped from training with no error. Label smoothing needs a custom compute_loss_func
    # before it can be turned on here.
    label_smoothing_factor: 0.0
    # NEFTune embedding noise. Null disables it. It hooks the LLM's input
    # embedding layer, so it perturbs prompt/text tokens only and leaves the
    # visual soft tokens untouched -- verify that is what you want before
    # setting a value (typical range 5.0-15.0).
    neftune_noise_alpha: null
    dataloader_num_workers: 6
    disable_tqdm: True
    auto_output_dir: False
    output_dir: outputs/test
    lr_scheduler_type: cosine
    dataloader_drop_last: true
  generation_config:
    max_new_tokens: 128
    do_sample: false
    # num_beams: 4
    # early_stopping: true
    # length_penalty: 1.0
  llm_dtype: bfloat16
  visual_backbone_dtype: auto

data:
  processor:
    video_processor:
      padding_to_multiple_of: 4
      do_resize: false
      # C-RADIO performs its expected preprocessing internally.
      do_normalize: false
