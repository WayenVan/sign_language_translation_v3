# @package _global_

defaults:
  - /model: base_model
  # - model: pretrained_encoder_model
  - /data: ph14t_*x224x224_qwen_multiling
  # - data: ph14t_*x224x224_qwen
  - /datamodule: standard
  - /peft: none
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

engine:
  eval_information:
    every_n_evaluations: -1
    num_samples: 4
  train_probe:
    every_n_evaluations: 1
    num_samples: 800
    seed: 42
    metric_key_prefix: train_probe
  dsid_scheduler:
    warmup_ratio: 0.01
    decay_ratio: 0.3
  training_args:
    do_train: true
    do_predict: true
    predict_with_teacher_forcing: false
    num_train_epochs: 30
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 1
    report_to: wandb
    remove_unused_columns: False
    ddp_find_unused_parameters: True
    save_strategy: best
    save_steps: 4000
    save_total_limit: 1
    # Keep only the model in each checkpoint, dropping the optimizer, scheduler
    # and RNG state -- and, under FSDP, the separate full-size
    # `pytorch_model_fsdp.bin` that `save_fsdp_model` writes alongside them.
    # Trades `resume_from_checkpoint` for roughly half the bytes per save.
    # Transformers rejects this together with `load_best_model_at_end` under
    # FSDP/DeepSpeed, so that option stays off; `save_strategy: best` still
    # saves only on an improvement of `metric_for_best_model`, the best
    # checkpoint just has to be loaded explicitly (e.g. csi_slt.commands.evaluate).
    save_only_model: true
    logging_steps: 50
    eval_strategy: "steps"
    eval_steps: 4000
    metric_for_best_model: "eval_overall_weighted_bleu4"
    greater_is_better: True
    learning_rate: 1e-4
    dataloader_num_workers: 6
    disable_tqdm: True
    auto_output_dir: False
    output_dir: outputs/test
    lr_scheduler_type: cosine
    restore_callback_states_from_checkpoint: true
    dataloader_persistent_workers: False
    dataloader_drop_last: true
  generation_config:
    max_new_tokens: 128
    do_sample: false
    # num_beams: 4
    # early_stopping: true
    # length_penalty: 1.0
  metrics:
    xcomet_every_n_evaluations: -1

  llm_dtype: auto
  visual_backbone_dtype: auto
