type: lora

# Stage-2 modality-fusion LoRA for Qwen3-4B (36 layers, hidden 2560,
# 32 q heads x 128, 8 kv heads x 128), targeting the FIRST N decoder blocks
# counted from the input side.
#
# Why the input side. A frozen-LLM stage-1 checkpoint has taught the visual
# adapter to emit vectors that live in the LLM's *input* embedding space; what
# the LLM has never done is *read* them. Re-reading a new token type is work the
# lower and middle blocks do -- the last blocks only re-write the output
# distribution. So the ablation axis here is depth-from-the-input: `count: N`
# adapts blocks [0 .. N-1], and `count: null` adapts all 36 (the default, and
# the setting the repo's own v4.0 evidence backs -- every all-layer llm-LoRA
# continuation gained: de 0.1162 -> 0.1460, en 0.1399 -> 0.2225,
# zh 0.2030 -> 0.2861).
#
# `llm_lora_layers` is resolved against the live decoder at injection, so no
# hand-written absolute indices fall out of sync when the base model's depth
# changes; the checkpoint serializes the resolved indices.
#
# Budget: q (2560x4096) + v (2560x1024) at r=8 costs 81,920 params per block,
# 2.95M over all 36 -- still under a sixth of the 20M visual adapter this runs
# alongside, which is why rank is the cheap knob and the adapter learning rate
# is the expensive one.
#
# Pair with engine.trainability: llm=lora, visual_adapter=full, everything else
# frozen.

llm_lora_config:
  r: 8
  lora_alpha: 16
  # 7,096 training sentences is the whole budget; dropout is free regularization
  # on the side being newly unfrozen. Active while engine.trainability.llm
  # resolves to runtime_mode=follow, which any non-frozen parameter_mode does.
  lora_dropout: 0.1
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"

llm_lora_layers:
  # anchor: first -- span starts at block 0 and runs `count` blocks toward the
  # output. count: null -> every block; a launcher overrides
  # peft.llm_lora_layers.count=N to sweep the depth.
  anchor: first
  pattern: "layers"
  count: null
