type: lora

# C-RADIO v4 SO400M has 27 ViT blocks (0-26). Apply visual LoRA to the latter
# half -- the 14 blocks ending at the backbone's output_layer.
# Pair with engine.trainability: visual_backbone=lora, everything else frozen.
#
# `visual_lora_layers` is resolved against the live backbone at injection:
# anchor=output_layer means the span ends at the block that feeds the adapter,
# so it follows visual_backbone_config.output_layer. With output_layer=-1 this
# is blocks 13-26, exactly the previous hand-written list. The checkpoint
# serializes the resolved absolute indices.

visual_lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv"

visual_lora_layers:
  pattern: "blocks"
  anchor: output_layer
  count: 14
