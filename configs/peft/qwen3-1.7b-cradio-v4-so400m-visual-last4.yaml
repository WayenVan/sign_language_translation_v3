type: lora

# Keep the multimodal projection adapter trainable while applying LoRA only to
# the final four C-RADIO ViT blocks. The Qwen LLM remains fully frozen.
trainability:
  llm_lora: false
  visual_lora: true
  visual_adapter: true

visual_lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv"
  layers_pattern: "blocks"
  layers_to_transform:
    - 23
    - 24
    - 25
    - 26
