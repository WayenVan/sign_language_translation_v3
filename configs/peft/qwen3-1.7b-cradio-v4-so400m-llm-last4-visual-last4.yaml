type: lora

trainability:
  llm_lora: true
  visual_lora: true
  visual_adapter: true

llm_lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
  layers_pattern: "layers"
  layers_to_transform:
    - 24
    - 25
    - 26
    - 27

visual_lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv"
  layers_pattern: "blocks"
  layers_to_transform:
    - 23
    - 24
    - 25
    - 26
