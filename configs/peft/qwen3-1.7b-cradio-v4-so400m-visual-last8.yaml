type: lora

# LoRA on the final eight C-RADIO ViT blocks only.
# Pair with engine.trainability: visual_backbone=lora, everything else frozen.

visual_lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv"
  layers_pattern: "blocks"
  layers_to_transform:
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 26
