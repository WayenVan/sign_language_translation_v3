# @package _global_

defaults:
  - /data: ph14t_*x224x224_qwen_multiling
  - /datamodule: standard
  - /prompt: fixed_prompt
  - override /hydra/hydra_logging: none
  - override /hydra/job_logging: none
  - _self_

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null

seed: 42

model:
  checkpoint_dir: ???

engine:
  # checkpoint: load at torch's default dtype, then cast every tensor back to
  # the dtype the checkpoint actually stores -- a bf16 LLM next to an fp32
  # visual tower for the v5.0 stage-2 runs, i.e. what training ran with.
  # `auto` follows config.json's `dtype` field, but that field records the
  # config object at save time and not the weights (train.py casts the LLM to
  # bf16 after loading), so it upcasts a bf16 LLM to fp32: double the memory,
  # no added precision. Explicit dtypes (float32, bfloat16, ...) still cast the
  # whole model. See csi_slt/utils/checkpoint_dtypes.py.
  model_dtype: checkpoint
  training_args:
    do_train: false
    do_eval: false
    do_predict: true
    predict_with_generate: true
    predict_with_teacher_forcing: false
    per_device_eval_batch_size: 1
    report_to: none
    remove_unused_columns: false
    dataloader_num_workers: 6
    dataloader_persistent_workers: true
    disable_tqdm: false
    auto_output_dir: false
    output_dir: outputs/evaluation
    logging_steps: 15
  generation_config:
    max_new_tokens: 128
    do_sample: false

experiment:
  permutation: false
