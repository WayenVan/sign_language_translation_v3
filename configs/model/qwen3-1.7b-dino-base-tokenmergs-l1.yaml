config:
  hidden_size: 2048
  video_soft_token_id: 151656
  video_token_scale: 0.125
  video_bidirectional_attention: true
  # Adapter-side temporal position of each visual token, added before the
  # LLM applies its own RoPE: learned (trainable table) | none | sincos.
  visual_position_embedding_type: learned
  llm_model_name_or_path: Qwen/Qwen3-1.7B
  visual_backbone_type: dinov2
  visual_backbone_config:
    id: facebook/dinov2-with-registers-base
    output_layer: -2
  visual_adapter_type: temporal_merge
  visual_adapter_kwargs:
    hidden_size: 768
    target_hidden_size: 2048
    num_heads_spatial: 12
    num_layers_spatial: 2
    num_extra_queries_spatial: 4
    num_heads_temporal: 16
    num_layers_temporal: 1
    use_temporal_shuffle: True
    mlp_depth_spatial: 2
    drop_out: 0.1
