config:
  hidden_size: 2048
  video_soft_token_id: 151656
  video_token_scale: 0.5
  llm_model_name_or_path: Qwen/Qwen3-1.7B
  visual_backbone_type: c_radio_v4
  visual_backbone_config:
    id: nvidia/C-RADIOv4-SO400M
    output_layer: [-1]
  visual_adapter_type: dinoframe_cross_v25_shuffle
  visual_adapter_kwargs:
    input_dim: 1152
    cls_input_dim: 2304
    output_dim: 2048
    temperature: 0.1
    spatial_window_radius: null
    temporal_gate_init: -2.0 # sigmoid
    # V25 fuses the shuffled CLS/PATCH streams and emits 1 token per group.
    temporal_scale_factor: 2
    use_short_temporal_conv: false
