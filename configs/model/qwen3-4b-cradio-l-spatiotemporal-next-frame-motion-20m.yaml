load_from_checkpoint: false
checkpoint_dir: null

# Parameter-matched counterpart of
# qwen3-4b-cradio-l-spatiotemporal-pooled-linear-20m.yaml. This combines the
# patch-level correspondence branch from the next-frame ablation with the
# window-level difference branch from the motion ablation. Everything outside
# visual_adapter_kwargs remains identical to the two individual 20M runs.

config:
  # Qwen3-4B embedding width; adapter output_dim must match this exactly.
  hidden_size: 2560
  video_soft_token_id: 151656

  # The adapter emits one token for every two input frames.
  video_token_scale: 0.5

  # Keep the standard causal LLM attention mask.
  video_bidirectional_attention: false
  visual_position_embedding_type: none

  # CTC consumes the adapter output at T/2; its codebook becomes the LLM prefix.
  ctc_loss_weight: 1.0
  ctc_vocab_size: 2417
  ctc_blank_id: 2

  llm_model_name_or_path: Qwen/Qwen3-4B

  visual_backbone_type: c_radio_v4
  visual_backbone_config:
    id: nvidia/C-RADIOv4-SO400M
    output_layer: -1

  visual_adapter_type: spatiotemporal_next_frame_motion
  visual_adapter_kwargs:
    # C-RADIOv4-SO400M patch width and Qwen3-4B embedding width.
    input_dim: 1152
    output_dim: 2560

    # Window size of MotionTemporalFusion. Every video's frame count must be
    # divisible by it, preventing a window from crossing a packed-video
    # boundary.
    temporal_scale_factor: 2

    # null infers a square patch grid from the patch-token count.
    patch_grid_size: null

    # Patch-level next-frame correspondence branch. These values match
    # qwen3-4b-cradio-l-spatiotemporal-next-frame-20m exactly.
    patch_fusion_hidden_dim: 1024
    patch_fusion_temperature: 0.1
    patch_fusion_matching_top_k: 1
    patch_fusion_window_radius: 3
    patch_fusion_gate_init: 1.0

    # Window-level SwiGLU motion branch. These values match
    # qwen3-4b-cradio-l-spatiotemporal-motion-20m exactly.
    motion_hidden_dim: 1024
    motion_gate_init: -2.0

    # 1152 -> 3474 -> GELU -> 2560. The rank pays for both fusion branches:
    # including affine LayerNorm, the complete adapter has 19,999,380
    # trainable parameters against the baseline's 19,999,369, a difference of
    # only 11 parameters (0.000055%). This is the closest integer-rank match.
    projection_rank: 3474
    use_layer_norm: true
