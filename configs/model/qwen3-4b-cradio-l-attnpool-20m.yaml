load_from_checkpoint: false
checkpoint_dir: null

config:
  # Qwen3-4B embedding width; adapter output_dim must match this exactly.
  hidden_size: 2560
  video_soft_token_id: 151656

  # The adapter emits one token for every two input frames.
  video_token_scale: 0.5
  video_bidirectional_attention: false
  visual_position_embedding_type: none

  # CTC consumes the adapter output at T/2; its codebook becomes the LLM prefix.
  ctc_loss_weight: 1.0
  ctc_vocab_size: 2417
  ctc_blank_id: 2

  llm_model_name_or_path: Qwen/Qwen3-4B

  visual_backbone_type: c_radio_v4
  visual_backbone_config:
    id: nvidia/C-RADIOv4-SO400M
    # Patch features come from the final block; the adapter ignores the
    # backbone's summary/CLS vector entirely. The layer-wise probe found the
    # last block best at the discrimination this task needs -- hand vs face
    # Fisher ratio 0.72 there against ~0.50 mid-stack -- so there is no reason
    # to read patches from an intermediate block.
    output_layer: -1
    # CLS-to-patch selection scores come from the twenty-fifth-last block.
    attention_layer: -25

  visual_adapter_type: attnpool
  visual_adapter_kwargs:
    # C-RADIOv4-SO400M patch width and Qwen3-4B embedding width.
    input_dim: 1152
    output_dim: 2560

    # Emit one visual token per non-overlapping pair of input frames.
    temporal_scale_factor: 2
    # 1152 -> 5024 -> GELU -> 2560. Together with the spatial residual block,
    # this gives 19,999,904 adapter parameters.
    # NOTE: the temporal block now carries its own LayerNorm and output
    # projection, so enabling use_temporal_conv adds 1,334,016 parameters.
    # Drop the rank to 4665 if you turn it on and want to hold the 20M budget.
    projection_rank: 5024
    use_layer_norm: true

    # CLS attention processing and hard spatial selection.
    top_k: 48
    attention_smooth_kernel_size: 3
    # null infers a square patch grid from the patch-token count.
    patch_grid_size: null

    # Contextualize every patch before applying the hard mask at pooling time.
    # With both convolutions off the adapter carries no patch_context at all,
    # and its parameters reduce to exactly the pooled-linear baseline's shape.
    use_spatial_conv: true
    spatial_conv_kernel_size: 3
    # Off for speed: the temporal branch pays a packed<->padded round trip and
    # four layout copies, which cost more than its depthwise Conv1d, and it is
    # the only reason packed_to_padded runs at all. Temporal context then comes
    # only from the fixed mean over temporal_scale_factor frames.
    # CAUTION: this is a speed choice, not a quality one. The one run that had
    # the temporal branch enabled fit *better* than this config at every
    # matched step (train-loss gap vs the pooled-linear baseline was +0.528
    # with it on versus +0.597 with it off, at step 6000). Re-measure before
    # treating "off" as the better setting.
    use_temporal_conv: false
    # Unused while use_temporal_conv is false.
    temporal_conv_kernel_size: 3
