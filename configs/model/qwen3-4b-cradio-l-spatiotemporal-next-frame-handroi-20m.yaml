load_from_checkpoint: false
checkpoint_dir: null

# Parameter-matched counterpart of
# qwen3-4b-cradio-l-spatiotemporal-pooled-linear-20m.yaml. This is the two
# branches that actually moved dev BLEU-4 put in one adapter: patches are first
# fused with their next-frame match, then the fused patches are pooled twice --
# once globally and once over the frozen scorer's hand ROI -- and the ROI half
# rides in as a gated residual.
#
# Dev BLEU-4 @24k of the three runs this combines (train probe in brackets):
#
#   pooled-linear baseline    --      (gap +0.004 @30k)
#   handroi concat            0.0824  [0.0898]
#   handroi gated             0.0865  [0.0864]
#   next-frame fusion         0.1135  [0.1278]
#
# Two readings drive the choices below. Next-frame fusion is the larger effect
# by a wide margin, so it keeps the settings of its own reference run verbatim.
# And on the hand-ROI side the gated form beat concat on dev while closing the
# train-dev gap to zero, so this takes `gated`, not `concat`.
#
# Selection still scores raw backbone patches while both branches pool the
# fused ones -- the scorer's coefficients are only valid for the untransformed
# feature distribution.

config:
  # Qwen3-4B embedding width; adapter output_dim must match this exactly.
  hidden_size: 2560
  video_soft_token_id: 151656

  # The adapter emits one token for every two input frames.
  video_token_scale: 0.5

  # Keep the standard causal LLM attention mask.
  video_bidirectional_attention: false
  visual_position_embedding_type: none

  # CTC consumes the adapter output at T/2; its codebook becomes the LLM prefix.
  ctc_loss_weight: 1.0
  ctc_vocab_size: 1118
  ctc_blank_id: 2

  llm_model_name_or_path: Qwen/Qwen3-4B

  visual_backbone_type: c_radio_v4
  visual_backbone_config:
    id: nvidia/C-RADIOv4-SO400M
    # Must match what the scorer was fitted on; a mismatch degrades its ranking
    # silently rather than failing. The scorer's own config records what it was
    # fitted against.
    output_layer: -1

  visual_adapter_type: spatiotemporal_next_frame_hand_roi
  visual_adapter_kwargs:
    # C-RADIOv4-SO400M patch width and Qwen3-4B embedding width.
    input_dim: 1152
    output_dim: 2560

    # Window size of the temporal mean. Every video's frame count must be
    # divisible by it, which is also what keeps a window from spanning two
    # videos in the packed batch.
    temporal_scale_factor: 2

    # --- next-frame patch fusion -------------------------------------------
    # Identical to qwen3-4b-cradio-l-spatiotemporal-next-frame-20m, field for
    # field, so any difference against that run comes from the ROI half alone.

    # null infers a square patch grid from the patch-token count.
    patch_grid_size: null
    # Hidden width of the fusion space the content, delta and displacement
    # streams are projected into. The block costs 3,460 * H + 5,761
    # parameters, here 3,548,801 (17.7% of the budget).
    patch_fusion_hidden_dim: 1024
    # Softmax temperature over cosine similarities, and how many next-frame
    # candidates survive before that softmax. top_k=1 makes the match a hard
    # nearest neighbour.
    patch_fusion_temperature: 0.1
    patch_fusion_matching_top_k: 1
    # Chebyshev radius, in patch units, of the window a match may come from.
    patch_fusion_window_radius: 3
    # The value the reference next-frame run used. It is deliberately far more
    # open than the ROI gate below: this residual is diluted across all 196
    # patches by the spatial mean, the ROI residual is a whole vector beside
    # the global one. Learnable in both directions either way.
    patch_fusion_gate_init: 1.0

    # --- hand-ROI pooling ---------------------------------------------------

    # Fitted offline by preprocess/train_scorer.py. Read only when a model is
    # built from pretrained components; a checkpoint carries the coefficients
    # itself, so this directory need not survive.
    scorer_path: outputs/hand_patch_scorer
    # Patches kept per frame. Measured on held-out videos with this scorer,
    # k=24 keeps 98.3% of hand patches while spending 11.4% of the budget on
    # non-hand ones -- the better side of that curve for a plain mean.
    top_k: 24
    # Fitted constants, and this also marks the scorer always-frozen so a plan
    # with visual_adapter.mode=full cannot recurse into it.
    freeze_scorer: true

    # projection(global) + s(gate) * f(roi), rather than concat's joint MLP
    # over [global; roi]. It starts at the pooled-linear baseline when
    # s(gate) = 0, so the ROI half has to earn its contribution -- and on the
    # standalone hand-ROI pair that is what showed up: gated reached 0.0865 dev
    # with a zero train-dev gap against concat's 0.0824 at +0.007.
    fusion_mode: gated
    # sigmoid(-2) ~= 0.119, matching qwen3-4b-cradio-l-handroi-gated-20m. Note
    # that run had not yet been swept on dev, so this is still a value to
    # select, not a settled one.
    gate_init: -2.0

    # --- budget -------------------------------------------------------------
    # 1152 -> 2878 -> GELU -> 2560 for the global branch, 1152 -> 1550 -> GELU
    # -> 2560 -> LayerNorm for the ROI residual. Both ranks drop steeply from
    # the standalone gated run's 3500/1884 because the fusion block now takes
    # 3.55M of the same budget; the 1884/3500 = 0.538 split between them is
    # kept, since the global branch still has to do the baseline's whole job
    # while the ROI branch is a correction.
    #
    # Including affine LayerNorms this comes to 19,999,694 trainable
    # parameters against the baseline's 19,999,369, a difference of 325
    # (0.0016%). One rank step is 3,713 parameters in either branch, so this is
    # the closest integer match available. The frozen scorer's 1,153
    # coefficients are excluded.
    projection_rank: 2878
    roi_projection_rank: 1550
    use_layer_norm: true

    # Both left off so this run isolates the combination itself. They are the
    # first knobs to reach for afterwards -- .ai/overfitting_component_
    # attribution.md argues the projection hidden layer is where the memorizing
    # happens -- but turning either on here would confound the comparison
    # against the two runs above.
    spatial_dropout: 0.0
    projection_dropout: 0.0
