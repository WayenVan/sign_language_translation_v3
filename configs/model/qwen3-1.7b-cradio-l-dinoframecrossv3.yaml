config:
  hidden_size: 2048
  video_soft_token_id: 151656
  # V3 emits 4 query tokens per stride-2 window: 4 / 2 = 2 tokens per frame.
  video_token_scale: 2.0
  video_bidirectional_attention: true
  # Adapter-side temporal position of each visual token, added before the
  # LLM applies its own RoPE: learned (trainable table) | none | sincos.
  visual_position_embedding_type: learned
  llm_model_name_or_path: Qwen/Qwen3-1.7B
  visual_backbone_type: c_radio_v4
  visual_backbone_config:
    id: nvidia/C-RADIOv4-SO400M
    output_layer: -1
  visual_adapter_type: dinoframe_cross_v3
  visual_adapter_kwargs:
    input_dim: 1152
    cls_input_dim: 2304
    output_dim: 2048
    num_queries: 4
    query_hidden_dim: 1024
    num_attention_heads: 4
    query_ffn_hidden_dim: 4096
    attention_dropout: 0.0
    temporal_window_size: 4
    temporal_window_stride: 4
    temporal_hidden_dim: 1152
    temporal_gate_init: -2.0
    temperature: 0.1
    spatial_window_radius: 3
