type: auto

config:
  hidden_size: 4096
  video_soft_token_id: 151656
  video_token_scale: 1.0
  llm_model_name_or_path: Qwen/Qwen3-8B
  visual_backbone_type: dinov2
  visual_backbone_config:
    id: facebook/dinov2-with-registers-base
    output_layer: -1
  visual_adapter_type: dinoframe_cross_v2_shuffle
  visual_adapter_kwargs:
    input_dim: 768
    output_dim: 4096
    temperature: 0.1
    temporal_gate_init: -2 #sigmoid
  contrastive_loss_weight: 1.0
  contrastive_text_encoding_mode: embedding_mean
  contrastive_text_queue_size: 1024
