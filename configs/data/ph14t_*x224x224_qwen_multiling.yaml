data_root: dataset/PHOENIX-2014-T-release-v3

ctc_tokenizer_dir: outputs/ctc_tokenizer_real

# PHOENIX spells its glosses in upper case with transliterated umlauts
# (KOENNEN), hyphenated compounds (WIE-AUSSEHEN) and morphological prefixes
# (neg-, poss-). This rewrites them into spellings the LLM tokenizer knows,
# and is read only when seeding the CTC codebook -- never by training itself.
ctc_gloss_surface:
  _target_: csi_slt.data.ph14t.gloss_surface.phoenix_gloss_surface_candidates
  _partial_: true

processor:
  _target_: csi_slt.data.processors.slt_processor.SignTranslationProcessor
  video_token_scale: 1.0
  num_extra_video_tokens: 2
  pseudo_gloss_dropout: 0.0
  video_processor:
    _target_: csi_slt.data.processors.sign_video_processor.SignVideoProcessor
    size:
      height: 224
      width: 224
    padding_to_multiple_of: 4
    image_mean: [0.485, 0.456, 0.406]
    image_std: [0.229, 0.224, 0.225]
    do_normalize: true
    do_crop: false
    do_resize: false
    crop_size:
      height: 224
      width: 224
    do_random_speed: true
    do_random_resize: true

train:
  dataset: &dataset
    _target_: csi_slt.data.ph14t.Ph14TMultiLinglDataset
    data_root: ${data.data_root}
    mode: train
    pseudo_gloss_column: orth
  collator: &collator
    _target_: csi_slt.data.collators.general_collator.GeneralSLTCollator
    debug: false

val:
  dataset:
    <<: *dataset
    mode: validation
  collator:
    <<: *collator

test:
  dataset:
    <<: *dataset
    mode: test
  collator:
    <<: *collator
