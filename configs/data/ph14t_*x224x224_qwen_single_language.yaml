data_root: dataset/PHOENIX-2014-T-release-v3
language: de

ctc_tokenizer_dir: outputs/ctc_tokenizer

processor:
  _target_: csi_slt.data.processors.slt_processor.SignTranslationProcessor
  video_token_scale: 1.0
  num_extra_video_tokens: 2
  pseudo_gloss_dropout: 0.2
  video_processor:
    _target_: csi_slt.data.processors.sign_video_processor.SignVideoProcessor
    size:
      height: 224
      width: 224
    padding_to_multiple_of: 4
    image_mean: [0.485, 0.456, 0.406]
    image_std: [0.229, 0.224, 0.225]
    do_normalize: true
    do_crop: false
    do_resize: false
    crop_size:
      height: 224
      width: 224
    do_random_speed: true

train:
  dataset: &dataset
    _target_: csi_slt.data.ph14t.Ph14TSingleLanguageDataset
    data_root: ${data.data_root}
    language: ${data.language}
    mode: train
    pseudo_gloss_column: orig_pseudo_gloss_strict
  collator: &collator
    _target_: csi_slt.data.collators.general_collator.GeneralSLTCollator
    debug: false

val:
  dataset:
    <<: *dataset
    mode: validation
  collator:
    <<: *collator

test:
  dataset:
    <<: *dataset
    mode: test
  collator:
    <<: *collator
