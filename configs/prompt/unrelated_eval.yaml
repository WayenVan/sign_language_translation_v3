# Unrelated-task diagnostic evaluation. Each expanded test row carries the
# exact prompt ID that must be used.

test:
  _target_: csi_slt.engine.prompt_resolver.PromptIdFromRowResolver
  sampler:
    _target_: csi_slt.engine.prompt_sampler.PromptSampler
    prompt_paths: prompts/unrelated.jsonl
  prompt_id_column: prompt_id
  target_lang_column: lang
