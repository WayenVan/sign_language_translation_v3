# DiversePrompt experiment:
# - training samples canonical + diverse prompts randomly by target language;
# - validation and standard test always use the canonical prompt.

train:
  _target_: csi_slt.engine.prompt_resolver.RandomPromptResolver
  sampler:
    _target_: csi_slt.engine.prompt_sampler.PromptSampler
    prompt_paths: prompts/train.jsonl
    seed: 42
  target_lang_column: lang

val: &canonical_resolver
  _target_: csi_slt.engine.prompt_resolver.FixedPromptResolver
  sampler:
    _target_: csi_slt.engine.prompt_sampler.PromptSampler
    prompt_paths: prompts/train.jsonl
  prompt_ids:
    de: canonical_en_de_001
    en: canonical_en_en_001
    zh: canonical_en_zh_001
  target_lang_column: lang

test: *canonical_resolver
